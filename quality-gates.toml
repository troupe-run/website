# The merge gates' thresholds for website (troupe-run/infrastructure spec: quality-gates). scripts/quality_gates.py,
# delivered from infrastructure, reads it strictly: an unknown key or a wrong type fails the check. It isn't delivered:
# these are website's own. Defaults approved by the owner on 2026-11-18
# (openspec/changes/archive/2026-11-18-quality-gates/design.md).
version = 1

# No [coverage]: website measures no coverage. Coverage and mutation testing apply only to the repositories
# troupe-run/infrastructure's scripts/mutation.json lists (owner, 2026-11-18, infrastructure#332).

# Cyclomatic complexity (lizard) of each function a change adds or edits: above the limit, it may not be new or more
# complex than before. lizard can't read .astro files.
[complexity]
block_above = 25
languages = ["javascript", "typescript"]
exclude = ["**/tests/**", "tests/**"]

# A pull request that changes the lock file fails on an advisory of these severities that has a fix.
[audit]
lock_files = ["package-lock.json"]
block = ["high", "critical"]

# The size of each text file the work adds or changes: above block_above, it may not be new or bigger than before,
# unless [size.allow] gives it its own ceiling; above warn_above it's noted. A review reads every changed file whole,
# and one Read holds about 25,000 tokens. Limits set by the owner on 2026-11-19 (troupe-run/infrastructure#271,
# openspec/changes/archive/2026-11-19-gate-files there). Fixtures, archived changes and the lock file aren't reviewed
# as code, so they aren't measured; binary files and the files .github/guard-delivery.json lists never are.
[size]
block_above = 49152
warn_above = 32768
exclude = ["**/fixtures/**", "openspec/changes/archive/**", "package-lock.json"]

# The files over block_above on 2026-11-19, each capped at its size then, rounded up to the KiB, plus 16 KiB. Each has
# an issue to split it. Remove an entry once its file is under block_above: the check fails on an entry that's no
# longer needed.
[size.allow]
"docs/superpowers/plans/2026-10-07-troupe-run-site.md" = 146432 # troupe-run/website#148
