# The merge gates' thresholds for website (troupe-run/infrastructure spec: quality-gates). scripts/quality_gates.py,
# delivered from infrastructure, reads it strictly: an unknown key or a wrong type fails the check. It isn't delivered:
# these are website's own. Defaults approved by the owner on 2026-11-18
# (openspec/changes/archive/2026-11-18-quality-gates/design.md).
version = 1

# website measures no coverage: only the repositories troupe-run/infrastructure names do (owner, 2026-11-18,
# infrastructure#332). Nothing here reads this table. It stays only because the delivered module requires it, and
# goes once infrastructure#332 makes it optional.
[coverage]
floor = 80.0
tolerance = 0.5

[coverage.packages.src]
paths = ["src"]

[coverage.packages.scripts]
paths = ["scripts"]

# Cyclomatic complexity (lizard) of each function a change adds or edits: above the limit, it may not be new or more
# complex than before. lizard can't read .astro files.
[complexity]
block_above = 25
languages = ["javascript", "typescript"]
exclude = ["**/tests/**", "tests/**"]

# A pull request that changes the lock file fails on an advisory of these severities that has a fix.
[audit]
lock_files = ["package-lock.json"]
block = ["high", "critical"]
