name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The merge queue's commit: main plus the pull requests queued ahead, a tree no pull request tested. `test` runs the
  # whole check on it, as on a push to main, and the queue lands it only if `test` passes (spec: quality-check). The
  # deploy follows CI only on a push to main, so a queue run publishes nothing (spec: build-and-deploy).
  merge_group:
permissions:
  contents: read
jobs:
  # The required check is this job's name, `test`. Every gate is in scripts/check.py, which
  # contributors and the guard's commit hook run too, so CI and local checks can't diverge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run scripts/check.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
