name: Dependency report (weekly)
# The weekly dependency audit (spec: quality-check, "Advisories no gate blocks on are reported weekly";
# troupe-run/infrastructure spec: quality-gates; quality-gates design D5). A pull request that changes package-lock.json
# is blocked only by a high or critical advisory with a fix; this audits the whole lock file on main every Monday and
# keeps one "Dependency advisories" issue: opened when there are advisories, its list replaced while there are, and
# closed when there are none. scripts/quality_gates.py, which troupe-run/infrastructure delivers, is the same module
# the check runs. npm audit reads the lock file alone, so nothing is installed.
# When audit opens the issue, the board job puts it on the troupe roadmap board (project 1). Only the board job can
# read the board App's key, and it runs no code from this repository or npm.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      issue-url: ${{ steps.report.outputs.issue-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/quality_gates.py report --repository "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT"
  board:
    needs: audit
    if: ${{ !cancelled() && needs.audit.outputs.issue-url != '' }}
    runs-on: ubuntu-latest
    environment: board
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@v3
        id: token
        with:
          client-id: ${{ vars.BOARD_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOARD_APP_PRIVATE_KEY }}
          owner: troupe-run
          permission-organization-projects: write
      - env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_URL: ${{ needs.audit.outputs.issue-url }}
        run: |
          # audit hands over a URL; it's checked before it's used.
          if [[ ! "$ISSUE_URL" =~ ^https://github\.com/troupe-run/website/issues/[0-9]+$ ]]; then
            printf '::error::issue-url from the audit job is not an issue in troupe-run/website: %q\n' "$ISSUE_URL"
            exit 1
          fi
          gh project item-add 1 --owner troupe-run --url "$ISSUE_URL"
